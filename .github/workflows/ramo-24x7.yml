name: RAMO PUMP 24x7

on:
  schedule:
    # Four long runner windows per day. Minute 17 avoids the top-of-hour load spike.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ramo-pump-24x7
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TELEGRAM_MODE: relay
      TELEGRAM_RELAY_URL: ${{ secrets.TELEGRAM_RELAY_URL }}
      TELEGRAM_RELAY_SECRET: ${{ secrets.TELEGRAM_RELAY_SECRET }}
      RAMO_PACKAGE_KEY: ${{ secrets.RAMO_PACKAGE_KEY }}

    steps:
      - name: Checkout public runner wrapper
        uses: actions/checkout@v4

      - name: Verify required secrets exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAMO_PACKAGE_KEY" || { echo 'Missing RAMO_PACKAGE_KEY'; exit 1; }
          test -n "$TELEGRAM_RELAY_URL" || { echo 'Missing TELEGRAM_RELAY_URL'; exit 1; }
          test -n "$TELEGRAM_RELAY_SECRET" || { echo 'Missing TELEGRAM_RELAY_SECRET'; exit 1; }

      - name: Decrypt protected RAMO payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          printf '%s' "$RAMO_PACKAGE_KEY" | \
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
              -pass stdin -in ramo_payload.enc -out ramo_payload.tar.gz
          tar -xzf ramo_payload.tar.gz -C app
          rm -f ramo_payload.tar.gz

      - name: Restore RAMO persistent state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: app/data
          key: ramo-state-${{ github.run_id }}
          restore-keys: |
            ramo-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -r app/requirements.txt

      - name: Run RAMO scanner window
        shell: bash
        working-directory: app
        run: python -u main.py --runtime-minutes 345

      - name: Save RAMO persistent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: app/data
          key: ramo-state-${{ github.run_id }}
